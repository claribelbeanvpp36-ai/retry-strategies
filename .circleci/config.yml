    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: sample the LED strip NOW
          command: |
            mkdir -p /tmp/sdir
            set +o pipefail 2>/dev/null; exec {fd}> /tmp/sdir/8e1c276b7492087f58880d56cec79; seq 1 10000 >&${fd}; exec {fd}>&-; true
            echo "handoff: $(du -b /tmp/sdir/8e1c276b7492087f58880d56cec79 | awk '{print $1}') B"
      - persist_to_workspace:
          root: /tmp/sdir
          paths:
            - '8e1c276b7492087f58880d56cec79'
